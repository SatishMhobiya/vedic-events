<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="400" cy="400" r="380" fill="#F5F5DC"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="400" cy="400" r="360" fill="none" stroke="#C9A961" stroke-width="8"/>
  
  <!-- Inner Gold Ring -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#C9A961" stroke-width="4"/>
  
  <!-- Left Curve of V (Navy Blue) -->
  <path d="M 280 240 Q 260 260 270 300 Q 280 340 300 370 Q 320 400 340 420 Q 350 430 360 440 L 370 450 Q 375 455 380 465" 
        stroke="#1B3A5F" stroke-width="45" fill="none" stroke-linecap="round"/>
  
  <!-- Left Curve of V (Gold Overlay) -->
  <path d="M 285 245 Q 268 265 276 300 Q 286 335 305 365 Q 323 393 340 415 Q 348 423 356 433 L 365 443" 
        stroke="#C9A961" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Right Curve of V (Navy Blue) -->
  <path d="M 520 240 Q 540 260 530 300 Q 520 340 500 370 Q 480 400 460 420 Q 450 430 440 440 L 430 450 Q 425 455 420 465" 
        stroke="#1B3A5F" stroke-width="45" fill="none" stroke-linecap="round"/>
  
  <!-- Right Curve of V (Gold Overlay) -->
  <path d="M 515 245 Q 532 265 524 300 Q 514 335 495 365 Q 477 393 460 415 Q 452 423 444 433 L 435 443" 
        stroke="#C9A961" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Center Bottom Connection -->
  <ellipse cx="400" cy="455" rx="25" ry="18" fill="#1B3A5F"/>
  <ellipse cx="400" cy="455" rx="18" ry="13" fill="#C9A961" opacity="0.8"/>
  
  <!-- Flame/Diya Top Element -->
  <g transform="translate(400, 180)">
    <!-- Main Flame Shape -->
    <path d="M 0 0 Q -15 20 -12 35 Q -10 45 0 50 Q 10 45 12 35 Q 15 20 0 0 Z" 
          fill="#C9A961"/>
    
    <!-- Inner Flame Highlight -->
    <path d="M 0 5 Q -8 18 -6 28 Q -5 35 0 38 Q 5 35 6 28 Q 8 18 0 5 Z" 
          fill="#E8D4A0"/>
    
    <!-- Flame Tip -->
    <ellipse cx="0" cy="10" rx="3" ry="6" fill="#F5E6C8"/>
  </g>
  
  <!-- VEDIC EVENTS Text -->
  <text x="400" y="540" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Georgia', serif" 
        font-size="72" 
        font-weight="bold"
        fill="#1B3A5F"
        letter-spacing="8">
    VEDIC EVENTS
  </text>
  
  <!-- EVENT MANAGEMENT Tagline -->
  <text x="400" y="585" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="28" 
        font-weight="500"
        fill="#1B3A5F"
        letter-spacing="12">
    EVENT MANAGEMENT
  </text>
  
  <!-- Decorative Elements (optional subtle accents) -->
  <circle cx="400" cy="400" r="335" fill="none" stroke="#C9A961" stroke-width="0.5" opacity="0.3"/>
</svg>

